<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPD Compass</title>
<meta name="description" content="Free CPD tracker for Australian nurses and midwives, built around the NMBA CPD registration standard.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e8077">
<meta property="og:title" content="CPD Compass — Your CPD, on course.">
<meta property="og:description" content="Free CPD tracking for Australian nurses and midwives. Hours countdown, certificate scanning, learning plans and an audit-ready portfolio.">
<meta property="og:image" content="share-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CPD Compass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  /* CPD Compass brand: Compass Teal #0E8077, Harbour Navy #12355B, Coral #F2785C, Sand #F6F4EF */
  --bg:#f6f4ef;--card:#ffffff;--card2:#f1efe8;--text:#13202b;--muted:#5b6670;--line:#e3e0d7;
  --brand:#0e8077;--brand-ink:#ffffff;--brand-soft:#dcefec;--navy:#12355b;--coral:#e8664a;--accent:#e8664a;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;
  --nursing:#0e8077;--midwifery:#7c3aed;--endorsement:#e8664a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);--r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1219;--card:#141c25;--card2:#1a2430;--text:#e6eeec;--muted:#93a29e;--line:#26332f;
  --brand:#3cc7b8;--brand-ink:#04201c;--brand-soft:#123a35;--navy:#0b2440;--coral:#f58a70;--accent:#f58a70;--ok:#4ade80;--warn:#f59e0b;--danger:#f87171;
  --nursing:#3cc7b8;--midwifery:#a78bfa;--endorsement:#f58a70;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0c1219;--card:#141c25;--card2:#1a2430;--text:#e6eeec;--muted:#93a29e;--line:#26332f;
  --brand:#3cc7b8;--brand-ink:#04201c;--brand-soft:#123a35;--navy:#0b2440;--coral:#f58a70;--accent:#f58a70;--ok:#4ade80;--warn:#f59e0b;--danger:#f87171;
  --nursing:#3cc7b8;--midwifery:#a78bfa;--endorsement:#f58a70;--shadow:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
label.f{display:block;margin:12px 0 0}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* header + nav */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:var(--safe-t);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:32px;height:32px;border-radius:9px;overflow:hidden;flex:none;display:block}.logo svg{width:100%;height:100%;display:block}
.wm{font-weight:800;letter-spacing:-.02em}.wm b{color:var(--brand);font-weight:600}
header.top h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
.icon-btn{border:0;background:var(--card);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .wrap{display:flex;padding:0 4px}
nav.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--brand)}
nav.tabs svg{width:24px;height:24px}
main{padding:14px 0 calc(96px + var(--safe-b))}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.sec-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:20px 2px 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:650;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--brand);padding:8px 10px;min-height:36px}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-color:transparent}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
button.chip{cursor:pointer}

/* home */
.hero{background:linear-gradient(135deg,#0e8077,#12355b);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;border:16px solid rgba(255,255,255,.08);pointer-events:none}
.hero .accent{color:#ffc2b3}
.hero .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .lbl{opacity:.9;font-size:14px}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.ring{text-align:center;padding:6px 4px}
.ring svg{width:110px;height:110px}
.ring .t{font-weight:700;font-size:14px;margin-top:2px}
.ring .s{font-size:12.5px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.qa svg{width:26px;height:26px;color:var(--brand)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.dot.y{background:var(--ok)}.dot.n{background:var(--warn)}

/* list items */
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .ttl{font-weight:650;overflow-wrap:anywhere}
.item .meta{font-size:13px;color:var(--muted)}
.hrs{font-weight:800;font-size:15px;white-space:nowrap}
.tap{cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(76px + var(--safe-b));z-index:15;width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 18px rgba(0,0,0,.2);display:grid;place-items:center}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search svg{position:absolute;left:11px;top:12px;width:20px;height:20px;color:var(--muted)}

/* profile */
.pf-banner{height:92px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(120deg,#0e8077,#12355b);margin:-16px -16px 0;position:relative;overflow:hidden}.pf-banner::after{content:"";position:absolute;right:24px;top:-60px;width:170px;height:170px;border-radius:50%;border:14px solid rgba(255,255,255,.1)}
.pf-photo{position:relative;z-index:1;width:96px;height:96px;border-radius:50%;border:4px solid var(--card);background:var(--card2);margin-top:-50px;object-fit:cover;display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--muted);overflow:hidden}
.pf-photo img{width:100%;height:100%;object-fit:cover}
.pf-name{font-size:22px;font-weight:800;margin:8px 0 2px}
.edit{border:0;background:none;color:var(--muted);padding:4px;border-radius:8px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-size:17px;flex:1}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px}
@keyframes up{from{transform:translateY(40px);opacity:.6}}@keyframes fade{from{opacity:0}}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.att .th{width:84px;height:84px;border-radius:10px;border:1px solid var(--line);background:var(--card2);position:relative;overflow:hidden;display:grid;place-items:center;font-size:12px;text-align:center;color:var(--muted)}
.att .th img{width:100%;height:100%;object-fit:cover}
.att .th button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.cbx{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14.5px;font-weight:600}
.cbx input{width:20px;height:20px;accent-color:var(--brand);margin:0}
.callout{border-radius:12px;padding:10px 12px;font-size:14px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text);margin-top:10px}
.callout.info{background:var(--brand-soft)}
.ai-out{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14.5px;margin-top:10px}
.chat{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
canvas.scan{width:100%;max-height:52vh;object-fit:contain;background:#222;border-radius:12px;display:block}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#14201d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + var(--safe-t)) 0 calc(24px + var(--safe-b))}
.bk{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.bk:first-child{border-top:0}
.bk .cv{width:84px;height:126px;flex:none;border-radius:6px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18);background:linear-gradient(160deg,#12355b,#0b1f36);color:#f6e7c9;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:600 12px/1.25 Georgia,'Times New Roman',serif}
.bk .cv img{width:100%;height:100%;object-fit:cover;display:block}
.bk h4{margin:0;font:700 17px/1.25 Georgia,'Times New Roman',serif}
.thanks{border:0;background:linear-gradient(135deg,color-mix(in srgb,var(--coral) 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--coral) 35%,transparent)}
.onb h1{font-size:30px;letter-spacing:-.02em;margin:14px 0 6px}
.onb-hero{background:linear-gradient(150deg,#0e8077,#12355b);color:#fff;border-radius:24px;padding:26px 22px;position:relative;overflow:hidden;margin-bottom:14px}
.onb-hero::after{content:"";position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;border-radius:50%;border:18px solid rgba(255,255,255,.08)}
.onb-hero h1{color:#fff;margin:14px 0 4px;font-size:32px}.onb-hero .tag{color:#ffc2b3;font-weight:700;font-size:17px}
.install{border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--coral) 14%,var(--card));border:1px solid color-mix(in srgb,var(--coral) 40%,transparent);font-size:14px;margin-bottom:12px}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--brand)}
table{border-collapse:collapse;width:100%}
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000}
  #app,.sheet-wrap,#toast{display:none!important}
  #print{display:block;font:10.5pt/1.4 -apple-system,Helvetica,Arial,sans-serif;color:#000}
  #print h1{font-size:18pt;margin:0 0 4pt}#print h2{font-size:12.5pt;margin:14pt 0 6pt;border-bottom:1.5pt solid #0f766e;padding-bottom:2pt;color:#0f766e}
  #print table{margin-top:4pt}#print th,#print td{border:.6pt solid #999;padding:4pt 5pt;vertical-align:top;text-align:left;font-size:9pt}
  #print th{background:#e8f3f1}
  #print .ev{page-break-inside:avoid;margin:8pt 0}#print .ev img{max-width:100%;max-height:640px;border:.5pt solid #ccc}
  #print tr{page-break-inside:avoid}
  #print .rs-h{display:flex;gap:14pt;align-items:center}#print .rs-h img{width:70pt;height:70pt;border-radius:50%;object-fit:cover}
  #print .job{margin:0 0 8pt;page-break-inside:avoid}#print .job b{font-size:11pt}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inFile" accept="image/*,application/pdf" multiple hidden>
<input type="file" id="inPhoto" accept="image/*" hidden>
<input type="file" id="inBackup" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   CPD Compass — free CPD tracker for Australian nurses & midwives
   All data stays on the device (IndexedDB). No server, no account.
   ========================================================= */
const APP = { name: 'CPD Compass', version: '1.4.1-beta' };
/* ---- BRAND: edit these to rebrand ---- */
const BRAND = {
  tagline: 'Your CPD, on course.',
  sub: 'Free CPD tracking for Australian nurses and midwives.',
  credit: '',            // e.g. 'Made by SimSmart' — shown on the welcome screen and About
  contact: '',           // e.g. an email for feedback; shown in About when set
  /* "Say thanks" — a gentle, optional way to support the app. Set enabled:false to remove it. */
  support: {
    enabled: true,
    author: 'Samantha Grosser',
    who: 'my wife',
    site: 'https://www.samgrosserbooks.com',
    line: 'historical fiction, much of it set in the Second World War',
    books: [
      { title: 'All That Remains', era: '1939 – present day', url: 'https://www.samgrosserbooks.com/historical-fiction-all-that-remains', cover: 'books/all-that-remains.jpg',
        blurb: 'On the eve of war, Eva Ravensby turns down Ben Marlowe’s proposal — a choice that shapes both their lives. Decades later she must face whether she was ever truly the life he chose.' },
      { title: 'Where the Light Still Shone', era: '1943 & 1995', url: 'https://www.samgrosserbooks.com/wwwii-fiction-where-the-light-still-shone', cover: 'books/where-the-light-still-shone.jpg',
        blurb: 'A village pub near an American airbase, a gunner named Zack, and Peggy’s quiet life upended. Fifty years on, her granddaughter uncovers the love affair.' },
      { title: 'The Last Goodbye', era: '1944 & 2014', url: 'https://www.samgrosserbooks.com/wwii-fiction-the-last-goodbye', cover: 'books/the-last-goodbye.jpg',
        blurb: 'Isobel longs to join the WAAF until an American airman changes her plans. Seventy years later, an inherited English house reveals the secrets she left behind.' },
      { title: 'An Officer’s Affair', era: '1944', url: 'https://www.samgrosserbooks.com/wwii-fiction-an-officers-affair', cover: 'books/an-officers-affair.jpg',
        blurb: 'Rachel’s husband comes home from Italy a changed man. A visit from Captain Andrews brings hope — and questions about what really happened there.' },
    ],
  },
  mark: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E8077"/><stop offset="1" stop-color="#12355B"/></linearGradient></defs><rect width="512" height="512" fill="url(#cg)"/><circle cx="256" cy="256" r="148" fill="none" stroke="#fff" stroke-width="20"/><g stroke="#fff" stroke-width="16" stroke-linecap="round"><path d="M256 132v26M256 354v26M132 256h26M354 256h26"/></g><g transform="rotate(38 256 256)"><path d="M256 150 286 256H226Z" fill="#F2785C"/><path d="M226 256h60L256 362Z" fill="#fff"/></g><circle cx="256" cy="256" r="15" fill="#12355B" stroke="#fff" stroke-width="6"/></svg>`,
};
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const iso = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseISO = s => { if (!s) return new Date(NaN); const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => { const d = typeof s === 'string' ? parseISO(s) : s; return isNaN(d) ? '' : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtH = n => { n = Math.round((Number(n) || 0) * 100) / 100; return (n % 1 ? n.toFixed(2).replace(/0$/, '') : n) + ''; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const dataURLToBlob = async u => (await fetch(u)).blob();

/* ---------- icons ---------- */
const I = {

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('cpdcompass', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('activities', { keyPath: 'id' }); d.createObjectStore('files', { keyPath: 'id' }); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out; const q = fn(s);
      if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(st, k) { return this.tx(st, 'readonly', s => s.get(k)); },
  put(st, v, k) { return this.tx(st, 'readwrite', s => k !== undefined ? s.put(v, k) : s.put(v)); },
  del(st, k) { return this.tx(st, 'readwrite', s => s.delete(k)); },
  all(st) { return this.tx(st, 'readonly', s => s.getAll()); },
  clear(st) { return this.tx(st, 'readwrite', s => s.clear()); },
};

/* ---------- CPD maths ---------- */
function period(y) { return { y, start: new Date(y, 5, 1), end: new Date(y + 1, 4, 31, 23, 59, 59), label: `${y}–${pad((y + 1) % 100)}` }; }
function periodFor(d) { d = new Date(d); return period(d.getMonth() >= 5 ? d.getFullYear() : d.getFullYear() - 1); }
function actsIn(y) { const p = period(y); return S.acts.filter(a => { const d = parseISO(a.date); return d >= p.start && d <= p.end; }).sort((a, b) => b.date.localeCompare(a.date)); }
function totals(y) { const t = { nursing: 0, midwifery: 0, endorsement: 0 }; actsIn(y).forEach(a => (a.streams || []).forEach(s => { if (s in t) t[s] += Number(a.hours) || 0; })); return t; }
function reqs() {
  const p = S.profile, r = {};
  if (p.nurseType) r.nursing = 20;
  if (p.midwife) r.midwifery = 20;
  if (p.endorsement && p.endorsement !== 'none') r.endorsement = 10;
  if (!Object.keys(r).length) r.nursing = 20;
  if (p.targets) for (const k in p.targets) if (p.targets[k] !== '' && p.targets[k] != null && !isNaN(p.targets[k])) r[k] = Number(p.targets[k]);
  return r;
}
function regLabel() {
  const p = S.profile, parts = [];
  if (p.nurseType === 'RN') parts.push('Registered nurse'); if (p.nurseType === 'EN') parts.push('Enrolled nurse');
  if (p.midwife) parts.push('Midwife');
  if (p.endorsement && p.endorsement !== 'none') parts.push(ENDORSEMENTS[p.endorsement]);
  return parts.join(' · ') || 'Registration not set';
}
function myStandards() {
  const p = S.profile, out = [];
  if (p.nurseType === 'RN') out.push('RN'); if (p.nurseType === 'EN') out.push('EN');
  if (p.midwife) out.push('RM'); if (p.endorsement === 'NP') out.push('NP');
  if (!out.length) out.push('RN');
  return out;
}
function allStandardItems() { return myStandards().flatMap(k => STANDARDS[k].items.map(i => `${k} ${i}`)); }
function yearsAvailable() {
  const cur = periodFor(new Date()).y; let min = cur;
  S.acts.forEach(a => { const y = periodFor(parseISO(a.date)).y; if (y < min) min = y; });
  Object.keys(S.plans).forEach(y => { if (+y < min) min = +y; });
  const out = []; for (let y = cur; y >= Math.max(min, cur - 6); y--) out.push(y); return out;
}
const daysLeft = y => Math.max(0, Math.ceil((period(y).end - new Date()) / 864e5));

const sheets = [];
function openSheet({ title, body, foot = '', onMount, wide }) {
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><button class="icon-btn" data-act="closeSheet" aria-label="Close">${I.x}</button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div>`;
  w.addEventListener('click', e => { if (e.target === w) closeSheet(); });
  document.body.appendChild(w); sheets.push(w);
  document.body.style.overflow = 'hidden';
  if (onMount) onMount(w);
  return w;
}
function closeSheet() { const w = sheets.pop(); if (w) { if (w._onClose) w._onClose(); w.remove(); } if (!sheets.length) document.body.style.overflow = ''; }
function topSheet() { return sheets[sheets.length - 1]; }

/* compress a photo to JPEG (no editor) — used for multi-file uploads */
async function compressImage(file, max = 2000) {
  const url = URL.createObjectURL(file);
  try { const img = await loadImage(url); const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85)); return { blob, name: file.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg' }; }
  catch (e) { return { blob: file, name: file.name, type: file.type }; } finally { URL.revokeObjectURL(url); }
}
/* in-app evidence viewer (window.open on blob URLs fails in iOS home-screen apps) */

function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function resizeToDataURL(file, max = 400, q = .85) {
  const url = URL.createObjectURL(file); const img = await loadImage(url); URL.revokeObjectURL(url);
  const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
/* Scan editor: rotate + "document" enhance (greyscale + auto-levels), compress to JPEG. Resolves {blob,name,type} or null */
function scanEditor(file) {
  return new Promise(async resolve => {
    if (file.type === 'application/pdf') return resolve({ blob: file, name: file.name, type: file.type });
    let img; const url = URL.createObjectURL(file);
    try { img = await loadImage(url); } catch (e) { toast('Could not open that image'); return resolve(null); }
    let rot = 0, enh = true, done = false;
    const w = openSheet({
      title: 'Scan certificate',
      body: `<canvas class="scan" id="scCan"></canvas><div class="row" style="margin-top:12px"><button class="btn sec" id="scRot">↻ Rotate</button><button class="btn sec" id="scEnh">Document mode: on</button></div><p class="hint">Tip: lay the certificate flat in good light and fill the frame. Document mode boosts contrast so it reads like a scan.</p>`,
      foot: `<button class="btn sec" style="flex:1" data-act="closeSheet">Cancel</button><button class="btn" style="flex:2" id="scUse">Use this scan</button>`,
    });
    w._onClose = () => { URL.revokeObjectURL(url); if (!done) resolve(null); };
    const cv = $('#scCan', w), ctx = cv.getContext('2d', { willReadFrequently: true });
    const draw = () => {
      const max = 2000, s = Math.min(1, max / Math.max(img.width, img.height));
      const iw = Math.round(img.width * s), ih = Math.round(img.height * s);
      const side = rot % 180 !== 0; cv.width = side ? ih : iw; cv.height = side ? iw : ih;
      ctx.save(); ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(img, -iw / 2, -ih / 2, iw, ih); ctx.restore();
      if (enh) {
        const d = ctx.getImageData(0, 0, cv.width, cv.height), p = d.data, hist = new Uint32Array(256);
        for (let i = 0; i < p.length; i += 4) { const l = (p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 | 0; p[i] = l; hist[l]++; }
        const n = p.length / 4; let acc = 0, lo = 0, hi = 255;
        for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > n * .02) { lo = i; break; } }
        acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > n * .08) { hi = i; break; } }
        if (hi - lo < 40) { lo = 0; hi = 255; } const rng = Math.max(1, hi - lo);
        for (let i = 0; i < p.length; i += 4) { let v = (p[i] - lo) * 255 / rng; v = v < 0 ? 0 : v > 255 ? 255 : v; v = 255 * Math.pow(v / 255, 1.25); p[i] = p[i + 1] = p[i + 2] = v; }
        ctx.putImageData(d, 0, 0);
      }
    };
    draw();
    $('#scRot', w).onclick = () => { rot = (rot + 90) % 360; draw(); };
    $('#scEnh', w).onclick = e => { enh = !enh; e.target.textContent = 'Document mode: ' + (enh ? 'on' : 'off'); draw(); };
    $('#scUse', w).onclick = () => cv.toBlob(b => { done = true; closeSheet(); resolve({ blob: b, name: `certificate-${iso(new Date())}.jpg`, type: 'image/jpeg' }); }, 'image/jpeg', .85);
  });
}

/* ---------- AI (bring your own key) ---------- */
const AI_DEF = {
  anthropic: { label: 'Claude (Anthropic)', model: 'claude-sonnet-4-5', hint: 'sk-ant-…', url: 'https://console.anthropic.com/settings/keys' },
  openai: { label: 'ChatGPT (OpenAI)', model: 'gpt-4.1-mini', hint: 'sk-…', url: 'https://platform.openai.com/api-keys' },
  gemini: { label: 'Gemini (Google)', model: 'gemini-2.5-flash', hint: 'AIza…', url: 'https://aistudio.google.com/apikey' },
};
const AI_SYS = `You are the CPD assistant inside "CPD Compass", a free app for Australian registered nurses, enrolled nurses, midwives and nurse/midwife practitioners.
Base all CPD guidance on the Nursing and Midwifery Board of Australia (NMBA) Registration standard: Continuing professional development (in effect from 1 June 2016; under review in 2026). Key rules: 20 hours per CPD year (1 June–31 May) for nursing; 20 for midwifery; 40 if dual registered (an activity relevant to both may count to both); nurse/midwife practitioners and scheduled-medicines-endorsed midwives need 10 additional hours related to the endorsement. One hour of active learning = one hour CPD. Routine annual mandatory training (CPR, fire) does not count; mandatory training with new learning can. Records need: learning need, action plan, activity type/topics/outcome, reflection on practice, evidence, hours. Keep records 5 years. Map learning to the relevant NMBA Standards for Practice.
Write in Australian English. Be concise and practical. Never invent hours, dates, providers or certificates. Where a detail is unknown, use [square brackets] for the user to fill in. You give guidance, not official regulatory advice — point to the NMBA for definitive answers.`;
function aiCfg() { const a = S.settings.ai; return { provider: a.provider, key: (a.keys[a.provider] || '').trim(), model: (a.models[a.provider] || '').trim() || AI_DEF[a.provider].model }; }
const aiReady = () => !!aiCfg().key;
/* history: [{role:'user'|'assistant', text}] ; image: {mime, b64} attached to the last user turn */
async function aiAsk(prompt, { system = AI_SYS, image = null, history = [], max = 1400 } = {}) {
  const { provider, key, model } = aiCfg();
  if (!key) throw new Error('Add your AI key in Settings first.');
  const turns = [...history, { role: 'user', text: prompt }];
  let res, data;
  if (provider === 'anthropic') {
    const messages = turns.map((t, i) => {
      if (i === turns.length - 1 && image) return { role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: image.mime, data: image.b64 } }, { type: 'text', text: t.text }] };
      return { role: t.role, content: t.text };
    });
    res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model, max_tokens: max, system, messages }) });
    data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
    return (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
  }
  if (provider === 'openai') {
    const messages = [{ role: 'system', content: system }, ...turns.map((t, i) => {
      if (i === turns.length - 1 && image) return { role: 'user', content: [{ type: 'text', text: t.text }, { type: 'image_url', image_url: { url: `data:${image.mime};base64,${image.b64}` } }] };
      return { role: t.role, content: t.text };
    })];
    res = await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key }, body: JSON.stringify({ model, messages, max_completion_tokens: max }) });
    data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
    return (data.choices?.[0]?.message?.content || '').trim();
  }
  if (provider === 'gemini') {
    const contents = turns.map((t, i) => {
      const parts = [{ text: t.text }];
      if (i === turns.length - 1 && image) parts.unshift({ inline_data: { mime_type: image.mime, data: image.b64 } });
      return { role: t.role === 'assistant' ? 'model' : 'user', parts };
    });
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents, generationConfig: { maxOutputTokens: max } }) });
    data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
    return (data.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('').trim();
  }
  throw new Error('Unknown AI provider');
}
function parseJSON(txt) {
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/); const s = m ? m[1] : txt;
  const a = s.indexOf('['), o = s.indexOf('{');
  const start = a !== -1 && (o === -1 || a < o) ? a : o; if (start === -1) throw new Error('No JSON in reply');
  const end = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));
  return JSON.parse(s.slice(start, end + 1));
}

/* ---------- download / share ---------- */
async function deliver(name, blob) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] }) && /iphone|ipad|android/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [f], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

const fmtElapsed = ms => { const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return h ? `${h} h ${pad(m % 60)} m` : `${m} min`; };
setInterval(() => { const el = $('#tmrEl'); if (el && S.settings.timer) el.textContent = fmtElapsed(Date.now() - S.settings.timer.start); }, 15000);

/* ---------- recency of practice: 450 h in the preceding 5 years, per profession ---------- */
const RECENCY_REQ = 450;
function recencyProfs() { const p = S.profile, o = []; if (p.nurseType) o.push('nursing'); if (p.midwife) o.push('midwifery'); return o.length ? o : ['nursing']; }
function recencyTotals() { const cur = periodFor(new Date()).y, pr = S.profile.practice || {}, t = {}; recencyProfs().forEach(k => { t[k] = 0; for (let y = cur - 4; y <= cur; y++) t[k] += Number(pr[y]?.[k]) || 0; }); return t; }
function recencyCard() {
  const pr = S.profile.practice || {};
  if (!Object.keys(pr).length) return `<div class="card" style="margin-top:12px"><h2>Recency of practice</h2><p class="small" style="margin:0 0 10px">At renewal you also declare at least <b>${RECENCY_REQ} hours of practice in the past 5 years</b>${recencyProfs().length > 1 ? ' for each profession' : ''}. Track it here too.</p><button class="btn sec sm" data-act="editPractice">Add practice hours</button></div>`;
  const t = recencyTotals();
  return `<div class="card tap" style="margin-top:12px" data-act="editPractice"><h2>Recency of practice<span class="sp"></span><span class="small muted">last 5 years</span></h2>${Object.keys(t).map(k => `<div class="small" style="display:flex;justify-content:space-between;margin-top:6px"><span>${STREAMS[k].label}</span><b>${Math.round(t[k]).toLocaleString('en-AU')} / ${RECENCY_REQ} h ${t[k] >= RECENCY_REQ ? '✓' : ''}</b></div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100, t[k] / RECENCY_REQ * 100)}%;background:${t[k] >= RECENCY_REQ ? 'var(--ok)' : STREAMS[k].color}"></i></div>`).join('')}</div>`;
}
function editPractice() {
  const cur = periodFor(new Date()).y, profs = recencyProfs(), pr = S.profile.practice || {};
  const ys = []; for (let y = cur; y >= cur - 4; y--) ys.push(y);
  const w = openSheet({
    title: 'Practice hours',
    body: `<p class="small muted">Hours worked (paid or unpaid) using your nursing or midwifery skills, per registration year. Practice includes clinical, management, education, research and advisory roles. Rough guide: full time ≈ 1,600–1,700 h a year; one 8-hour shift a fortnight ≈ 200 h a year.</p>
    ${ys.map(y => `<div class="row" style="align-items:flex-end"><div style="flex:.8;padding-bottom:12px;font-weight:600">${period(y).label}</div>${profs.map(k => `<label class="f"><span>${STREAMS[k].label} h</span><input type="number" inputmode="numeric" min="0" data-y="${y}" data-k="${k}" value="${pr[y]?.[k] ?? ''}"></label>`).join('')}</div>`).join('')}
    <p class="hint">New graduates whose qualification was awarded within the last 2 years are exempt. If dual registered, you declare recency separately for each profession.</p>`,
    foot: `<button class="btn sec" style="flex:1" data-act="closeSheet">Cancel</button><button class="btn" style="flex:2" id="prSave">Save</button>`,
  });
  $('#prSave', w).onclick = async () => { const o = {}; $$('input[data-y]', w).forEach(i => { if (i.value !== '') { (o[i.dataset.y] = o[i.dataset.y] || {})[i.dataset.k] = Number(i.value); } }); S.profile.practice = o; await save.profile(); closeSheet(); render(); toast('Saved'); };
}

function bindBasicsForm(root) {
  const upd = () => {

    $('#b_req', root).innerHTML = `Your minimum each CPD year: <b>${tot || 20} hours</b>${parts.length > 1 ? ' (' + parts.join(' + ') + ')' : ''}.${warn ? `<br><b>${warn}</b>` : ''}`;

  $('#a_aiRefl', w).onclick = e => {
    if (!aiReady()) return noAI();

      const txt = await aiAsk(`Draft a first-person CPD reflection (120–180 words, plain prose, no headings) for this activity. Cover: what I learned, how it applies to my context of practice, what I will do differently, and which NMBA standard(s) it relates to. Use [brackets] for details I need to supply. If my notes already contain a reflection, improve it rather than replacing its facts.

Learning need: ${need ? need.need : 'not stated'}
Topics/outcome: ${$('#a_topics', w).value}
My notes: ${$('#a_reflection', w).value}
${cpdContext()}`, { max: 700 });
      $('#a_reflection', w).value = txt; toast('Draft added — edit it to make it yours');
    });
  };
  if (!isNew) $('#a_del', w).onclick = async () => { if (await confirmBox('Delete this activity and its evidence?', 'Delete', true)) { for (const id of a.files) await DB.del('files', id); await DB.del('activities', a.id); S.acts = S.acts.filter(x => x.id !== a.id); closeSheet(); render(); toast('Deleted'); } };
  $('#a_save', w).onclick = async () => {
    const A = draft.a;
    A.title = titleEl.value.trim(); A.date = $('#a_date', w).value; A.hours = Number($('#a_hours', w).value) || 0; A.provider = $('#a_provider', w).value.trim(); A.type = typeEl.value;

    if (!(A.hours > 0)) return toast('Add the hours');
    if (!A.streams.length) return toast('Choose what it counts towards');
    for (const id of draft.removed) await DB.del('files', id);
    A.files = A.files.filter(id => !draft.removed.includes(id));

    await DB.put('activities', A);
    S.acts = S.acts.filter(x => x.id !== A.id).concat(A);
    const y = periodFor(parseISO(A.date)).y; if (y !== S.year) S.year = y;
    closeSheet(); render(); toast(isNew ? 'CPD logged ✓' : 'Saved');
  };
}

  const y = S.year; S.plans[y] = S.plans[y] || { self: {}, needs: [] }; const pl = S.plans[y];
  const n = id ? { ...pl.needs.find(x => x.id === id) } : Object.assign({ id: uid(), need: '', standard: '', goal: '', actions: '', target: iso(period(y).end), status: 'Planned' }, pre);

    <label class="f"><span>Status</span><select id="n_status">${['Planned', 'In progress', 'Achieved'].map(s => `<option ${n.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
    ${id ? '<button class="btn danger block" style="margin-top:18px" id="n_del">Delete</button>' : ''}`,
    foot: `<button class="btn sec" style="flex:1" data-act="closeSheet">Cancel</button><button class="btn" style="flex:2" id="n_save">Save</button>`,
  });

  $('#n_save', w).onclick = async () => {
    n.need = $('#n_need', w).value.trim(); if (!n.need) return toast('Describe the learning need');

async function aiNeeds(btn) {
  if (!aiReady()) return noAI();
  await withBusy(btn, async () => {
    const y = S.year, self = (S.plans[y] || {}).self || {};
    const rated = Object.entries(self).filter(([, v]) => v).map(([k, v]) => { const std = k.replace(/\d+$/, ''), i = +k.match(/\d+$/)[0]; return `${std} ${STANDARDS[std].items[i]}: ${{ c: 'confident', d: 'developing', p: 'priority' }[v]}`; });
    const txt = await aiAsk(`Suggest 4 specific, realistic CPD learning needs for me for this CPD year. Reply ONLY with a JSON array of objects: [{"need":"","standard":"exact text of one standard from the list","goal":"","actions":"2-3 concrete activities, preferring free Australian options where possible"}].
Standards list: ${allStandardItems().join(' | ')}
My self-assessment: ${rated.join('; ') || 'not done'}
${cpdContext()}
Profile summary: ${S.profile.about || ''} Experience: ${(S.profile.experience || []).map(e => e.role + ' at ' + e.org).join('; ')}`, { max: 1200 });
    const list = parseJSON(txt);
    const w = openSheet({ title: 'Suggested learning needs', body: `<p class="small muted">Tap “Add” to put one in your plan, then edit it to fit.</p>${list.map((n, i) => `<div class="card"><b>${esc(n.need)}</b><div class="small muted">${esc(n.standard)}</div><p class="small">${esc(n.goal)}</p><p class="small"><b>Plan:</b> ${esc(n.actions)}</p><button class="btn sm" data-i="${i}">Add to plan</button></div>`).join('')}` });
    w.addEventListener('click', async e => { const b = e.target.closest('[data-i]'); if (!b) return; const n = list[+b.dataset.i]; S.plans[y] = S.plans[y] || { self: {}, needs: [] }; S.plans[y].needs.push({ id: uid(), need: n.need, standard: allStandardItems().includes(n.standard) ? n.standard : '', goal: n.goal, actions: n.actions, target: iso(period(y).end), status: 'Planned' }); await save.plans(); b.disabled = true; b.textContent = 'Added ✓'; render(); });
  });
}

function openAI() {
  if (!aiReady()) return noAI();
  const hist = [];
  const w = openSheet({
    title: 'CPD assistant · ' + AI_DEF[aiCfg().provider].label,
    body: `<div class="chat" id="chat"><div class="msg a">Hi${S.profile.name ? ' ' + esc(S.profile.name.split(' ')[0]) : ''}! I can see your CPD progress for ${period(S.year).label}. Ask me about CPD requirements, ideas for free learning, help writing a reflection, or planning your hours.</div></div>
    <div class="chips" id="sugg">${['What counts as CPD?', 'Plan my remaining hours', 'Ideas for free CPD in my area', 'Do I need endorsement hours?'].map(s => `<button class="chip">${s}</button>`).join('')}</div>`,
    foot: `<input id="chatIn" placeholder="Ask about your CPD…" style="flex:1"><button class="btn" id="chatGo">Send</button>`,
  });
  const box = $('#chat', w), inp = $('#chatIn', w), go = $('#chatGo', w);
  const send = async text => {
    text = (text || inp.value).trim(); if (!text) return; inp.value = '';
    box.insertAdjacentHTML('beforeend', `<div class="msg u">${esc(text)}</div><div class="msg a" id="pend"><span class="spin"></span></div>`);
    $('.sheet-b', w).scrollTop = 1e9; go.disabled = true;
    try {
      const reply = await aiAsk(hist.length ? text : `${cpdContext()}\n\nMy question: ${text}`, { history: hist, max: 1000 });
      hist.push({ role: 'user', text: hist.length ? text : `${cpdContext()}\n\nMy question: ${text}` }, { role: 'assistant', text: reply });
      $('#pend', w).textContent = reply;
    } catch (e) { $('#pend', w).textContent = '⚠️ ' + e.message; }
    $('#pend', w).removeAttribute('id'); go.disabled = false; $('.sheet-b', w).scrollTop = 1e9;
  };
  go.onclick = () => send(); inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  $('#sugg', w).onclick = e => { const c = e.target.closest('.chip'); if (c) { $('#sugg', w).remove(); send(c.textContent); } };
}

async function doBackup() {
  toast('Preparing backup…');
  const files = [];
  for (const f of await DB.all('files')) files.push({ id: f.id, activityId: f.activityId, name: f.name, type: f.type, data: await blobToDataURL(f.blob) });
  const settings = JSON.parse(JSON.stringify(S.settings)); settings.ai.keys = {};
  const out = { app: 'cpd-compass', version: 1, exported: new Date().toISOString(), profile: S.profile, settings, plans: S.plans, sites: S.sites, activities: S.acts, files };
  await deliver(`cpd-compass-backup-${iso(new Date())}.json`, new Blob([JSON.stringify(out)], { type: 'application/json' }));
  S.settings.lastBackup = Date.now(); await save.settings(); if (S.settings.onboarded) render();
}
function doRestore() {
  pick('backup', async f => {
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'cpd-compass') throw new Error('Not a CPD Compass backup');
      if (S.acts.length && !(await confirmBox(`Replace the records on this device with the backup from ${fmtDate(iso(new Date(d.exported)))}? (${plural(d.activities.length, 'activity')})`, 'Replace'))) return;
      const keys = S.settings.ai.keys;
      await DB.clear('activities'); await DB.clear('files');
      for (const a of d.activities) await DB.put('activities', a);
      for (const x of d.files || []) await DB.put('files', { id: x.id, activityId: x.activityId, name: x.name, type: x.type, blob: await dataURLToBlob(x.data) });
      S.profile = Object.assign(defaultProfile(), d.profile); S.plans = d.plans || {}; S.sites = d.sites || { custom: [], hidden: [] };
      S.settings = Object.assign(defaultSettings(), d.settings, { onboarded: true }); S.settings.ai.keys = keys;
      await save.profile(); await save.plans(); await save.sites(); await save.settings();
      S.acts = await DB.all('activities'); while (sheets.length) closeSheet(); $('#app').innerHTML = ''; applyTheme(); render(); toast('Backup restored ✓');
    } catch (e) { toast('Restore failed: ' + e.message, 4000); }
  });
}

  aiNeeds: el => aiNeeds(el),
  learnCat: el => { S.learnCat = el.dataset.c; render(); },
  logFromSite: el => { const s = [...SITES, ...(S.sites.custom || [])].find(x => x.id === el.dataset.id); openActivity(null, { provider: s ? s.name.replace(/ – .*/, '') : '', type: 'Online module / eLearning' }); },
  hideSite: async el => { S.sites.hidden = [...new Set([...(S.sites.hidden || []), el.dataset.id])]; await save.sites(); render(); },
  unhideSites: async () => { S.sites.hidden = []; await save.sites(); render(); },
  delSite: async el => { S.sites.custom = S.sites.custom.filter(s => s.id !== el.dataset.id); await save.sites(); render(); },
  addSite: () => { const w = openSheet({ title: 'Add a learning site', body: `<label class="f"><span>Name</span><input id="ns_name"></label><label class="f"><span>Web address</span><input id="ns_url" type="url" placeholder="https://"></label><label class="f"><span>Category</span><input id="ns_cat" placeholder="e.g. Emergency" value="My sites"></label><label class="f"><span>Notes</span><textarea id="ns_desc"></textarea></label>`, foot: `<button class="btn block" id="ns_save">Add</button>` });
    $('#ns_save', w).onclick = async () => { let url = $('#ns_url', w).value.trim(); const name = $('#ns_name', w).value.trim(); if (!name || !url) return toast('Add a name and web address'); if (!/^https?:\/\//i.test(url)) url = 'https://' + url; S.sites.custom.push({ id: 'c' + uid(), name, url, cat: $('#ns_cat', w).value.trim() || 'My sites', desc: $('#ns_desc', w).value.trim(), tag: 'My site' }); await save.sites(); closeSheet(); render(); }; },
  editBasics: () => editBasics(), editAbout: () => editAbout(), editSkills: () => editSkills(),
  editExp: el => editList('exp', el.dataset.id), editEdu: el => editList('edu', el.dataset.id), editLic: el => editList('lic', el.dataset.id),
  printResume: () => printResume(), printPortfolio: () => printPortfolio(), exportCSV: () => exportCSV(), ics: () => exportICS(),
  openAI: () => openAI(), openSettings: () => openSettings(),
  editPractice: () => editPractice(),
  thanks: () => openThanks(),
  thanksDismiss: async () => { S.settings.thanksSeen = [...new Set([...(S.settings.thanksSeen || []), S.year])]; await save.settings(); render(); },
  privacy: () => openSheet({ title: 'Privacy statement', body: `<div class="small" style="margin-top:12px">${PRIVACY_HTML}</div>` }),
  timer: () => {
    if (S.settings.timer) return toast('Timer running — stop it on the Home screen');
    const w = openSheet({ title: 'Study timer', body: `<p class="small muted">Start the timer when you sit down to read or do a module. When you stop, it opens a log entry with the time filled in (rounded to the nearest 15 minutes).</p><label class="f"><span>What are you working on? (optional)</span><input id="tm_t" placeholder="e.g. Reading sepsis guideline"></label>`, foot: `<button class="btn block" id="tm_go">Start timer</button>` });
    $('#tm_go', w).onclick = async () => { S.settings.timer = { start: Date.now(), title: $('#tm_t', w).value.trim() }; await save.settings(); closeSheet(); render(); };
  },
  timerStop: async () => { const t = S.settings.timer; if (!t) return; const h = Math.max(.25, Math.round((Date.now() - t.start) / 9e5) / 4); S.settings.timer = null; await save.settings(); render(); openActivity(null, { title: t.title, hours: h, type: 'Self-directed learning (journal articles, guidelines)', date: iso(new Date(t.start)) }); },
  timerCancel: async () => { if (!(await confirmBox('Discard this timer?', 'Discard', true))) return; S.settings.timer = null; await save.settings(); render(); },
  backup: () => doBackup(), restore: () => doRestore(),
  theme: async el => { S.settings.theme = el.dataset.t; await save.settings(); applyTheme(); $$('[data-act=theme]').forEach(b => b.classList.toggle('on', b === el)); },
  wipe: async () => { if (!(await confirmBox('This permanently deletes your profile, CPD records and certificates from this device. Back up first if you need them.', 'Delete everything', true))) return; for (const s of ['kv', 'activities', 'files']) await DB.clear(s); location.reload(); },
  onbNext: async () => {
    if (onbStep === 1) { readBasics(document); if (!S.profile.name) return toast('Please add your name'); await save.profile(); }
    if (onbStep === 2) { const role = $('#o_role').value.trim(); if (role) { S.profile.experience.unshift({ id: uid(), role, org: $('#o_org').value.trim(), location: '', start: $('#o_start').value, end: '', current: true, desc: $('#o_desc').value.trim() }); await save.profile(); } return finishOnb(); }
    onbStep++; renderOnboarding(); window.scrollTo(0, 0);
  },
  onbSkip: () => finishOnb(),
  onbRestore: () => doRestore(),
};
async function finishOnb() { S.settings.onboarded = true; await save.settings(); $('#app').innerHTML = ''; S.tab = 'home'; render(); toast('Welcome to CPD Compass'); }
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });

/* ---------- boot ---------- */
(async () => {
  try { await load(); render(); }
  catch (e) { $('#app').innerHTML = `<div class="wrap" style="padding:40px 16px"><h2>Couldn't open storage</h2><p>${esc(e.message)}</p><p class="muted">Private browsing can block storage. Open CPD Compass in a normal browser window.</p></div>`; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;
      const b = document.createElement('div'); b.className = 'card'; b.style.cssText = 'position:fixed;left:16px;right:16px;top:calc(64px + var(--safe-t));z-index:40;max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px';
      b.innerHTML = '<div style="flex:1"><b>CPD Compass has been updated.</b><div class="small muted">Reload to get the new version. Your records are kept.</div></div><button class="btn sm">Reload</button>';
      b.querySelector('button').onclick = () => location.reload(); document.body.appendChild(b);
    });
  }
})();
</script>
</body>
</html>
